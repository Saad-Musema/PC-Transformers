name: Smoke Test

on:
  pull_request:
  push:
    branches:
      - main
      - ci/add-workflow

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      PC_SMOKE_TEST: "1"
      PC_ENCODED_DIR: data_preparation/encoded_smoke
      PC_MAX_LEN: "32"
      PC_BATCH_SIZE: "2"
      PC_SMOKE_TRAIN_PERCENT: "0.4"
      PC_SMOKE_VALID_PERCENT: "2.0"
      PC_SMOKE_TEST_PERCENT: "2.0"
      PC_GENERATE_MAX_SAMPLES: "1"
      PC_GENERATE_MAX_NEW_TOKENS: "16"
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare smoke tokens
        run: python data_preparation/prepare_tokens.py

      - name: Verify encoded smoke data
        run: |
          test -f data_preparation/encoded_smoke/train.pt
          test -f data_preparation/encoded_smoke/valid.pt
          test -f data_preparation/encoded_smoke/test.pt

      - name: Train smoke model
        run: python training.py

      - name: Verify final checkpoint
        run: test -f checkpoints/final_model.pt

      - name: Evaluate smoke model
        run: python eval.py

      - name: Generate smoke text
        run: python generate_text.py
